<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff2442"><meta name="description" content="小红书 AI 运营工作台：用数据发现问题，让 AI 洞察转化为具体行动。"><title>AI Growth OS · 小红书智能运营系统</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="shell">
<aside class="sidebar"><a class="brand" href="#dashboard"><span class="brand-symbol">红</span><span><b>AI Growth OS</b><small>小红书智能运营系统</small></span></a><div class="nav-label">工作空间</div><nav id="nav" aria-label="业务导航"></nav><div class="sidebar-bottom"><button class="upgrade" id="upgrade"><span class="spark">✦</span><b>让增长更有方向</b><small>与你的 AI 运营总监一起</small><span class="upgrade-link">开始对话 <span>↗</span></span></button><button class="user-account" id="user-account"><span class="avatar">A</span><span><b>Alex</b><small>个人创作者</small></span><span class="user-arrow">⌄</span></button></div></aside>
<div class="workspace"><header class="topbar"><button class="global-search" id="global-search"><span id="search-icon"></span><span>搜索内容、任务，或问问 AI</span><kbd>⌘ K</kbd></button><div class="top-right"><span class="demo-label"><i></i>演示工作空间</span><button class="icon-button" id="notifications" aria-label="查看通知"><span id="bell-icon"></span><i class="notification-dot"></i></button><div class="header-divider"></div><button class="avatar small" id="header-avatar" aria-label="打开账号设置">A</button></div></header><main id="main" tabindex="-1"></main><footer class="page-footer"><span>AI Growth OS</span><span>用数据洞察，让每一次创作更有价值</span><span>示例数据 · 未接入真实账号</span></footer></div>
<aside class="ai-panel" id="ai-panel" aria-label="AI 运营总监" hidden><div class="ai-heading"><span class="ai-logo">✦</span><div><b>AI 运营总监</b><small><i></i> 随时与你一起思考</small></div><button class="icon-button" id="new-chat" title="新对话" aria-label="开始新对话">↻</button><button class="icon-button" id="close-ai" aria-label="收起 AI 面板">×</button></div><div class="ai-context"><span>▣</span> <span id="ai-context">运营总览 · 近 7 天</span></div><div class="chat-scroll" id="chat"></div><form class="chat-form" id="chat-form"><label class="sr-only" for="chat-input">向 AI 提问</label><textarea id="chat-input" rows="2" placeholder="问问你的 AI 运营总监…"></textarea><div class="chat-form-bottom"><small>示例洞察 · 根据当前演示数据生成</small><button class="send" type="submit" aria-label="发送问题">↑</button></div></form></aside>
</div>
<button class="ai-fab" id="ai-fab"><span>✦</span> AI 运营总监 <span>↗</span></button>
<dialog id="dialog"><div id="dialog-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script></body></html>
